    <figcaption><b>Where the hook sits, and the way out.</b> A PreToolUse hook runs between the model's tool call and the tool. On allow, the file comes back whole. On block, only the hook's message comes back, and the model chooses its next call. Spotify's design assumes that choice is the worker script. In twelve tasks it never was: the model grepped the file instead, a few hundred lines at a time. The right-hand exit, a read with an offset, is the one the published hook leaves open; we closed it so the hook would do what the post describes.</figcaption>

    <figcaption><b>Why the test uses a stricter hook than the one Spotify shipped.</b> The published hook has an exception: a Read with an offset or limit is allowed, so the model can page through a big file after being refused it. In our pilot it did exactly that on every block, nine of nine, and 655 of the 770 lines ended up in context anyway. That is not the design the post describes, so we deleted the exception. Everything after this figure is measured with the exception closed.</figcaption>
