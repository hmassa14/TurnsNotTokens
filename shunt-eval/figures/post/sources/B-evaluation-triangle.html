<!doctype html><html><head><meta charset="utf-8"><title>Evaluation Triangle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --bg:#F5F6F3; --surface:#FFFFFF; --ink:#1B1F1D; --ink-2:#4A5350; --ink-3:#7B857F; --line:#D6DAD3; --hook:#B84E28; --soft:#ECEEE9; }
  body { background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; margin:0; }
  main { max-width:820px; margin:0 auto; padding:20px; }
  figure { margin:0; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:18px 22px 16px; }
  .fig-n { font-family:"IBM Plex Mono",monospace; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:6px; }
  .t { font-size:15px; font-weight:600; margin:0 0 2px; }
  .s { font-size:12.5px; color:var(--ink-2); margin:0; }
  svg text { font-family:"IBM Plex Sans",system-ui,sans-serif; }
  .lab { font-size:16px; font-weight:600; fill:var(--ink); }
  .q { font-size:13px; fill:var(--ink-2); }
  .add { font-size:15px; font-weight:600; fill:var(--hook); }
  .addq { font-size:12.5px; fill:var(--ink-2); }
  .tag { font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:0.06em; fill:var(--hook); }
</style></head><body>
<main><figure>
<span class="fig-n">Figure B · The evaluation triangle</span>
<p class="t">Every AI workflow trades off the same three things</p>
<p class="s">Judge a change on all three at once. For this experiment, I tracked one more on the side.</p>
<svg viewBox="0 0 760 390" width="100%" role="img" aria-label="A triangle with Performance at the top, Latency at the bottom left, and Cost at the bottom right. To the side, Behavior is marked as an extra dimension added for this example.">
  <polygon points="290,62 80,318 500,318" fill="#ECEEE9" stroke="#1B1F1D" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="290" cy="62" r="7" fill="#1B1F1D"/>
  <circle cx="80" cy="318" r="7" fill="#1B1F1D"/>
  <circle cx="500" cy="318" r="7" fill="#1B1F1D"/>
  <text class="lab" x="290" y="30" text-anchor="middle">Performance</text>
  <text class="q" x="290" y="48" text-anchor="middle">Did it get the right answer?</text>
  <text class="lab" x="80" y="350" text-anchor="middle">Latency</text>
  <text class="q" x="80" y="368" text-anchor="middle">How long did it take?</text>
  <text class="lab" x="500" y="350" text-anchor="middle">Cost</text>
  <text class="q" x="500" y="368" text-anchor="middle">What did it actually cost?</text>
  <line x1="408" y1="200" x2="572" y2="200" stroke="#B84E28" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="575" y="152" width="178" height="96" rx="8" fill="#FFFFFF" stroke="#B84E28" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="tag" x="664" y="176" text-anchor="middle">ADDED FOR THIS PIECE</text>
  <text class="add" x="664" y="202" text-anchor="middle">Behavior</text>
  <text class="addq" x="664" y="222" text-anchor="middle">What did the model</text>
  <text class="addq" x="664" y="238" text-anchor="middle">do after a block?</text>
</svg>
</figure></main>
</body></html>
