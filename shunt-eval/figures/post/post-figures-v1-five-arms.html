    <figcaption><b>Why the hook, and what shunt does.</b> Spotify's monorepo burns tokens on two kinds of non-reasoning work: reading a large file to check a fraction of it, and generating templated code where the structure is already known. shunt ships one delegation path per problem, both routed through the same Portal action, <code>aika:invoke-chat</code>, addressed by mode. Reading is enforced: a PreToolUse hook intercepts a Read over 350 lines before the frontier model sees the bytes and blocks it toward the bulk-reader skill. Code generation is not enforced at all — no hook watches a Write, so the code-writer skill only runs if the model's own judgment matches a task to its description. Both hand off to AiKA and are designed to bring back as little as possible: a summary for a read, a line count for a write.</figcaption>
