  <h1>Figures for the shunt write-up</h1>

    <figcaption><b>Where the hook sits, and the three ways out.</b> A PreToolUse hook runs between the model's tool call and the tool. On allow, the file comes back whole. On block, only the hook's message comes back, and the model chooses its next call. Spotify's design assumes that choice is the worker script. In 24 runs it never was: with the shipped hook the model re-read the file in slices, which the hook permits; with the exception closed it grepped instead.</figcaption>

    <figcaption><b>What "a request" is.</b> The model keeps nothing between calls. Every time it wants a tool, the conversation ends, Claude Code runs the tool, appends the result, and sends the entire transcript again. Caching makes the re-sent part cheap per token; it does not make it free, and it does nothing for the thinking the model does at the start of every request. Stock read the file once and needed three requests. The hook run needed eleven, and 655 of the 770 lines still went in, as slices. Numbers from the two transcripts.</figcaption>
